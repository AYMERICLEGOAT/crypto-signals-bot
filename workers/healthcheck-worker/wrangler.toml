name = "signal-subscription-healthcheck"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Toutes les heures, à la minute 0.
[triggers]
crons = ["0 * * * *"]

# Appel direct Worker-à-Worker (pas de DNS public) : plus fiable qu'un fetch()
# vers l'URL workers.dev publique, qui n'aboutit pas de façon fiable d'un
# Worker à l'autre (confirmé : la requête n'atteignait même pas le Worker
# principal — voir wrangler tail).
[[services]]
binding = "MAIN_WORKER"
service = "signal-subscription-bot"
