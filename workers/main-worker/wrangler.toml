name = "signal-subscription-bot"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cron Trigger : toutes les 5 minutes -> diffusion des signaux + rattrapage
# des paiements USDT/Monero/Litecoin (voir src/index.ts, scheduled()).
[triggers]
crons = ["*/5 * * * *"]

# Variables non sensibles (visibles dans ce fichier, donc jamais de secrets ici).
# Les vraies clés/tokens sont fournis via `wrangler secret put` (voir README).
[vars]
# Mainnet : le flux USDT off-chain (V2) surveille de vrais transferts USDT,
# donc il lui faut le vrai réseau — polygon-rpc.com renvoyait des erreurs
# depuis cet environnement, remplacé par un point d'accès public équivalent.
POLYGON_RPC_URL = "https://polygon-bor-rpc.publicnode.com"
# Contrat déployé sur Amoy (testnet) uniquement — conservé pour une
# réactivation future du flux on-chain, mais inutilisé par le code actif
# (V2 100% off-chain, voir cron/pollPayments.ts et payments/usdt.ts).
CONTRACT_ADDRESS = "0x057F9d816D1b2F6BdE2831bECe5dB9887B4Aa950"
MONERO_MIN_CONFIRMATIONS = "10"
LTC_MIN_CONFIRMATIONS = "1"
TELEGRAM_BOT_USERNAME = "ProVIPSignals_bot"
# Canal public gratuit (diffusion différée de 15 min, voir cron/dispatchPublicChannel.ts).
TELEGRAM_CHANNEL_ID = "-1004450068761"
# Même canal, lien public affiché aux utilisateurs (getChatMember veut l'ID numérique,
# les humains veulent un lien cliquable) — voir bot/commands/trial.ts (boucle virale).
TELEGRAM_CHANNEL_URL = "https://t.me/ProSignauxPublic"
# Adresse de réception USDT (V2 100% off-chain) — wallet OWNER, adresse publique.
PAYMENT_ADDRESS_USDT = "0x71367B5f4519700a63c2564b754cF959317E1f61"
# Guide visuel de paiement (signals/generate_payment_guide.py) — Storage public,
# nom de fichier fixe donc cette URL reste valide si l'image est régénérée.
PAYMENT_GUIDE_IMAGE_URL = "https://itajsfxouxbwcvmzartp.supabase.co/storage/v1/object/public/signal-charts/payment-guide.png"
# Telegram ID admin (toi) — gate la commande /stats.
ADMIN_TELEGRAM_ID = "8647576528"
# Désactivé tant qu'on n'a pas 30+ jours de signaux réels accumulés (voir
# db/liveWinRate.ts, Bloc 4) : une fois "true", les messages qui parlent de
# performance basculeront du backtest vers le taux de réussite RÉEL des
# signaux effectivement envoyés — plus fiable qu'un backtest in-sample.
DISPLAY_WINRATE = "false"
