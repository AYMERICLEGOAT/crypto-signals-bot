name: Publication Discord (quotidienne)

on:
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch: {}

jobs:
  post-discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r traffic/requirements.txt

      # Audit#30 (30/07) : retry automatique (3 tentatives, backoff) pour les
      # hoquets réseau transitoires (Discord API, Supabase) -- une vraie
      # erreur de configuration (token invalide, etc.) échoue quand même sur
      # les 3 tentatives et alerte normalement ci-dessous.
      - name: Publier le message du jour
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd traffic && python discord_daily.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}

      # Audit#13 : voir signals.yml pour le contexte (même secret TELEGRAM_BOT_TOKEN requis).
      - name: Alerter l'admin en cas d'échec
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=8647576528" \
            --data-urlencode "text=⚠️ Échec du workflow \"Publication Discord (quotidienne)\" (run #${{ github.run_number }}). Détails : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
