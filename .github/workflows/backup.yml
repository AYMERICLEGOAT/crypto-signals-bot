name: Sauvegarde hebdomadaire de la base

# Bloc 15.3 : Supabase ne propose aucun backup automatique sur le plan
# gratuit (ni quotidien, ni PITR) -- ce workflow est la seule sauvegarde
# réelle des données du bot.
#
# Deux sorties, jamais mélangées (voir signals/backup_db.py pour le detail
# de la separation table par table) :
#   - backups/public/  : aucune donnee personnelle -> commitee dans le depot
#     (public sur GitHub), pour un historique consultable sans risque.
#   - backups/private/ : telegram_id / wallets / adresses de paiement ->
#     JAMAIS commitee, JAMAIS en artefact GitHub Actions (correctif du 31/07 :
#     ce depot est PUBLIC, un artefact y est visible par n'importe quel
#     compte GitHub, pas seulement les "collaborateurs"). Uploadee par
#     backup_db.py directement vers un bucket Supabase Storage prive
#     (public=false, lisible uniquement avec la cle secrete du projet).
on:
  schedule:
    - cron: "0 3 * * 1" # lundi 3h UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r signals/requirements.txt

      # Audit#30 (30/07) : retry automatique (3 tentatives, backoff) -- un
      # hoquet réseau transitoire sur UNE table (voir backup_db.py, qui
      # alerte désormais sur tout échec même partiel) ne doit pas forcer une
      # intervention manuelle si un simple nouvel essai aurait suffi.
      # (`working-directory` n'est pas un input de nick-fields/retry -- le
      # `cd` se fait explicitement dans la commande.)
      - name: Exporter les tables Supabase (public + privé)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd signals && python backup_db.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Committer la sauvegarde publique (sans donnée personnelle)
        working-directory: signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/public/
          git diff --staged --quiet || git commit -m "Sauvegarde hebdomadaire du $(date -u +%Y-%m-%d)"
          git push

      - name: Alerter l'admin en cas d'échec
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=8647576528" \
            --data-urlencode "text=⚠️ Échec du workflow \"Sauvegarde hebdomadaire de la base\" (run #${{ github.run_number }}). Détails : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
