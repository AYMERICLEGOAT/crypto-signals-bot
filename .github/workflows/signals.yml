name: Signaux crypto (horaire)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# Race condition trouvée dans l'audit du 29/07 : ce workflow n'avait aucune
# protection contre un chevauchement (cron horaire + rerun manuel pendant un
# run encore actif, plausible pendant un incident type "0 signal depuis 3
# jours"). Deux runs qui insèrent chacun un signal pour la même bougie
# horaire produiraient un doublon, diffusé deux fois côté Worker. `queue`
# (pas `cancel-in-progress`) : le second run attend la fin du premier plutôt
# que de l'interrompre en plein milieu d'une insertion Supabase.
concurrency:
  group: signals-cron
  cancel-in-progress: false

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r signals/requirements.txt

      - name: Générer les signaux (source hybride Binance/CoinGecko/Coinbase/Kraken)
        working-directory: signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Alerte directe si les 4 sources de données échouent 3 cycles de
          # suite (voir signals/alerts.py) -- même secret que l'étape
          # d'alerte ci-dessous, ADMIN_TELEGRAM_ID a sa valeur par défaut
          # dans signals/config.py (non sensible, déjà en clair ailleurs).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py

      # Audit#13 : sans ça, un échec de ce workflow passait inaperçu jusqu'à
      # ce que quelqu'un remarque l'absence de nouveaux signaux. Nécessite le
      # secret de dépôt TELEGRAM_BOT_TOKEN (Settings > Secrets and variables
      # > Actions) -- même token que le bot ; ADMIN_TELEGRAM_ID n'est pas un
      # secret (déjà visible en clair dans wrangler.toml).
      - name: Alerter l'admin en cas d'échec
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=8647576528" \
            --data-urlencode "text=⚠️ Échec du workflow \"Signaux crypto (horaire)\" (run #${{ github.run_number }}). Détails : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
