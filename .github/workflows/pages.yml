# Publie le dossier public/ sur GitHub Pages.
#
# Pourquoi ce workflow existe. Le site SEO est généré quotidiennement par
# website/main.py, qui écrit ses pages dans public/ et les commite. Elles y sont
# depuis le début — 39 fichiers versionnés, pages de signaux, guides, FAQ,
# glossaire, sitemap — mais aucun serveur ne les servait : GitHub Pages n'avait
# jamais été activé, et SITE_BASE_URL pointait encore vers le gabarit
# "https://votre-site.pages.dev". Autrement dit, tout l'effort de référencement
# était invisible sur Internet, ce qui explique mieux qu'aucune formulation
# l'absence de visiteurs.
#
# Le déploiement passe par une action plutôt que par la publication de branche :
# GitHub Pages ne sait servir qu'à la racine ou depuis /docs quand on lui
# désigne une branche, et le site vit dans public/. Déployer l'artefact évite de
# restructurer le dépôt pour satisfaire une contrainte d'outillage.

name: Site public (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  # Permet de republier à la demande sans attendre un changement de contenu.
  workflow_dispatch:

# Un seul déploiement à la fois. `cancel-in-progress: false` : un déploiement
# déjà commencé va au bout plutôt que d'être interrompu à mi-chemin, ce qui
# laisserait le site dans un état partiel.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
