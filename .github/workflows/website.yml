name: Site SEO (quotidien)

# Audit#11 : le site ne se régénérait qu'une fois par jour alors que les
# signaux sont générés toutes les heures (signals.yml) — un nouveau signal
# pouvait donc rester invisible sur le site jusqu'à 23h. On se déclenche
# désormais aussi juste après chaque exécution réussie de "Signaux crypto
# (horaire)", en gardant le cron quotidien comme filet de sécurité (stats
# de performance à jour même sans nouveau signal ce jour-là).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_run:
    workflows: ["Signaux crypto (horaire)"]
    types: [completed]
  workflow_dispatch: {}

# Audit#30 (30/07) : ce workflow se déclenche jusqu'à ~24x/jour (une fois par
# exécution réussie de "Signaux crypto (horaire)", en plus du cron
# quotidien) -- même risque de chevauchement que signals.yml (voir son
# commentaire), jamais corrigé ici. `queue` (pas `cancel-in-progress`) : le
# second run attend la fin du premier plutôt que de l'interrompre en pleine
# publication GitHub (upsert_file, voir website/github_publisher.py).
concurrency:
  group: website-publish
  cancel-in-progress: false

jobs:
  publish-website:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r website/requirements.txt

      # Audit#30 (30/07) : retry automatique (3 tentatives, backoff) -- se
      # déclenche jusqu'à ~24x/jour, un hoquet réseau transitoire (Supabase,
      # API GitHub) n'a pas besoin d'attendre le prochain déclenchement.
      - name: Générer et publier le site (public/)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd website && python main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Nom "GITHUB_TOKEN" réservé par GitHub Actions (token auto à portée
          # limitée) : on ne peut pas créer de secret sous ce nom, d'où
          # SITE_PUBLISH_TOKEN ci-dessous, remappé vers la variable attendue
          # par website/config.py.
          GITHUB_TOKEN: ${{ secrets.SITE_PUBLISH_TOKEN }}
          GITHUB_REPO: AYMERICLEGOAT/crypto-signals-bot
          GITHUB_BRANCH: main
          SITE_SUBDIR: public
          SITE_BASE_URL: https://crypto-signals-bot-site.signalytics.workers.dev
          SITE_NAME: "Signaux Crypto Gratuits"
          TELEGRAM_BOT_USERNAME: ProVIPSignals_bot
          TELEGRAM_CHANNEL_URL: https://t.me/ProSignauxPublic

      # Audit#13 : voir signals.yml pour le contexte (même secret TELEGRAM_BOT_TOKEN requis).
      - name: Alerter l'admin en cas d'échec
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=8647576528" \
            --data-urlencode "text=⚠️ Échec du workflow \"Site SEO (quotidien)\" (run #${{ github.run_number }}). Détails : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
